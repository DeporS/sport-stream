# Single-node Apache Kafka (KRaft, no ZooKeeper) for local development only.
# The broker is published on 127.0.0.1:9092, so a collector running in WSL can
# reach it at 127.0.0.1:9092 and nothing outside this machine can.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Same address for host clients and for tools inside the container.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topics are created explicitly, never by a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Local demo credentials only.
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: sport_stream
    volumes:
      - sport_stream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport_stream"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sport_stream_pgdata:
