[package]
name = "sport-stream"
version = "0.1.0"
edition = "2024"
default-run = "sport-stream"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "json"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net"] }
